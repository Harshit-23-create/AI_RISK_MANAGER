name: AI Risk Manager CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
    - name: Run lint
      working-directory: ./backend
      run: npm run lint --if-present
    - name: Typecheck
      working-directory: ./backend
      run: npm run build --if-present
    - name: Run tests
      working-directory: ./backend
      run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Run lint
      working-directory: ./frontend
      run: npm run lint --if-present
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

  ml-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      working-directory: ./ml-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Test with pytest
      working-directory: ./ml-service
      run: |
        pytest
